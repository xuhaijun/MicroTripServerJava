# ============================================================
# 微旅途后端 · Nginx 反向代理 + TLS 终止
# ------------------------------------------------------------
# 挂载位置：容器内 /etc/nginx/conf.d/default.conf（见 docker-compose.prod.yml）
# 证书要求：/etc/nginx/certs/fullchain.pem 与 privkey.pem（脚本见 scripts/gen-self-signed-cert.sh）
#
# 为什么用 Nginx 终止 TLS 而不是应用直接开 HTTPS：
#   1) 证书轮换只改 Nginx，应用无感重启；
#   2) 应用可以只监听内网 HTTP，减少一层 TLS 握手开销；
#   3) 与 `server.forward-headers-strategy=native` 配合，应用仍能感知真实协议，
#      require-https 依然生效（不会因为"看起来是 HTTP"而误判）。
# ============================================================

# 上游：应用容器（服务名 app，Docker 内嵌 DNS 解析）
upstream microtrip_app {
    server app:3000;
    # 长连接复用：轨迹批量同步时减少 TCP 握手次数
    keepalive 32;
}

# ---------- 限流区（Nginx 层兜底，应用层另有 RateLimitFilter）----------
# 登录/注册接口单独收紧，防撞库；应用层限流按 JVM 内存计数，重启即清零，
# 放在 Nginx 层可以跨重启生效，两层互补。
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# ---------- HTTP：仅用于证书校验与跳转 HTTPS ----------
server {
    listen 80;
    server_name _;

    # Let's Encrypt 续期校验必须走明文，不能被 301 掉
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ---------- 证书 ----------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ---------- TLS 参数（TLSv1.2+ 起步，禁用已知弱套件）----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP Stapling：省掉客户端单独查询吊销状态的一次往返
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 223.5.5.5 119.29.29.29 valid=300s;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;              # 不暴露 Nginx 版本号

    # ---------- 请求体与超时 ----------
    # 单条轨迹最多 2 万个 GPS 点，JSON 数 MB，默认 1M 会直接 413
    client_max_body_size 20m;
    client_body_timeout 60s;
    # 大轨迹写入 + 批量插入可能耗时较久，读超时给足余量
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 5s;

    # 注意：响应压缩交给 Spring（server.compression 已开启）。
    # Nginx 这里不再开 gzip，避免对已压缩的响应做二次处理白耗 CPU。
    gzip off;

    # ---------- 转发头（应用靠这些头识别真实协议与客户端 IP）----------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # 关键：没有这一行，应用端 require-https 会把所有请求判为非安全通道 → 无限重定向
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";   # 配合 upstream keepalive

    # ---------- Actuator 收敛 ----------
    # 应用侧已把 Actuator 绑到容器内 0.0.0.0（便于编排探活），
    # 这里在入口处只放行健康检查，指标端点一律拒绝外网访问。
    location = /actuator/health         { proxy_pass http://microtrip_app; }
    location = /actuator/health/liveness  { proxy_pass http://microtrip_app; }
    location = /actuator/health/readiness { proxy_pass http://microtrip_app; }
    location /actuator/ {
        deny all;
        return 404;
    }

    # ---------- 登录 / 注册：更严的限流 ----------
    location ~ ^/(api/v1/)?auth/(login|register)$ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://microtrip_app;
    }

    # ---------- 文档：生产建议关闭（含全部接口结构）----------
    # 如需对外提供，注释掉下面两块即可
    location /swagger-ui/ {
        deny all;
        return 404;
    }
    location /v3/api-docs {
        deny all;
        return 404;
    }

    # ---------- 业务接口 ----------
    location / {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://microtrip_app;
    }
}
